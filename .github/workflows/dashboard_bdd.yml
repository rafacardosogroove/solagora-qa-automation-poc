name: 📊 Dashboard de Qualidade (BDD)

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * 1-5'   # Seg-Sex às 8h (UTC) — e-mail diário automático
  workflow_dispatch:          # Disparo manual pelo GitHub

jobs:

  # ============================================================
  # JOB 1 — Gera DASHBOARD.md e email_dashboard.html
  # ============================================================
  atualizar-dashboard:
    name: 📊 Gerar e Publicar Dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Histórico completo (ranking de commits precisa)

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📊 Gerar DASHBOARD.md e email_dashboard.html
        run: python gerar_dashboard.py

      - name: 💾 Commitar Dashboard Atualizado
        run: |
          git config --global user.name "QA Bot"
          git config --global user.email "qa-bot@solagora.com.br"
          git add DASHBOARD.md email_dashboard.html
          git diff --quiet && git diff --staged --quiet \
            || git commit -m "docs: 📊 atualiza dashboard automático [skip ci]" \
            && git push

  # ============================================================
  # JOB 2 — Envia e-mail com o HTML gerado (aguarda Job 1)
  # ============================================================
  enviar-email:
    name: 📧 Enviar Relatório por E-mail
    runs-on: ubuntu-latest
    needs: atualizar-dashboard

    steps:
      - name: 📥 Checkout (versão atualizada pelo bot)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📊 Regerar HTML (garante dados frescos após pull)
        run: python gerar_dashboard.py

      - name: 📧 Enviar E-mail
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python enviar_email.py
