name: 🛡️ Quality Gate (BDD Linter)
# DESABILITADO — migrado para Azure Pipelines (#432)
# Para reativar: remover a linha "if: false" abaixo
on:
  workflow_dispatch:  # Somente disparo manual — auto-triggers desabilitados

jobs:
  validar-bdd:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v3

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: ⚖️ Validar Padrões de BDD
        run: python validar_bdd.py