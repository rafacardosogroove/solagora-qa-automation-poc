# ============================================================
# Pipeline: Quality Gate — BDD Linter em PRs
# Equivalente a: .github/workflows/pr_quality_gate.yml
#
# Valida padrões BDD em Pull Requests para main.
# Bloqueia merge se validação falhar (configurar Branch Policy).
#
# CONFIGURAÇÃO NECESSÁRIA (uma vez):
#   Azure DevOps → Repos → Branches → main
#   → Branch Policies → Build Validation
#   → Adicionar este pipeline como obrigatório
# ============================================================

trigger: none   # Não dispara em push — só em PR

pr:
  branches:
    include:
      - main
  drafts: false   # Ignora draft PRs

variables:
  pythonVersion: '3.10'

pool:
  vmImage: ubuntu-latest

stages:
  - stage: QualityGate
    displayName: Quality Gate BDD Linter
    jobs:
      - job: ValidarBDD
        displayName: Validar Padrões BDD
        steps:

          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)
            displayName: Configurar Python

          - script: |
              python validar_bdd.py
            displayName: Validar Padrões de BDD
